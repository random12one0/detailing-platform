[build]
  base = "frontend"
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_SUPABASE_ANON_KEY,REACT_APP_SUPABASE_URL,REACT_APP_SUPABASE_FUNCTIONS_URL"

# SPA routing — every path serves index.html so react-router handles it.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
