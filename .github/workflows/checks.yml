# Runs on every push and pull request. A red check blocks merging a PR.
# Only the suites that need no secrets run here (see README.md).
name: checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: build
        run: npm run build
        working-directory: app
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - name: tests
        run: node --test tests/composition.test.mjs tests/design-contrast.test.mjs tests/landing-pricing.test.mjs tests/route-contract.test.mjs tests/integrated-owner-draft.test.mjs tests/back-office-setup-ai.test.mjs
      # tools/studio-audit: only the files that need no browser, AI, network or credentials
      - name: studio-audit tests
        run: node --test tools/studio-audit/audit-chooser.test.mjs tools/studio-audit/audit-engine.test.mjs tools/studio-audit/audit-journeys.test.mjs tools/studio-audit/audit-store.test.mjs tools/studio-audit/site-stamps.test.mjs
      - name: studio-audit AI-reading tests (pure ones; the rest need a browser and a copy of the app)
        run: node --test --test-name-pattern="facts go to|REVIEW-S5 F1, F2|knowledge pack|read strictly" tools/studio-audit/studio-ai.test.mjs
