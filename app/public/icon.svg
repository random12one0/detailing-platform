<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- THE SAME MARK app/index.html ALREADY SHIPS AS ITS FAVICON, AS A FILE.
       Not a new one: this is a white-label platform with no logo by design,
       and inventing one in a session is a brand decision nobody asked for.
       A manifest needs an icon at a URL, so the inline data: URI is written
       out here byte for byte. Its two colours are the system's own —
       --ink-0 for the ground, --ac for the mark. -->
  <rect width="32" height="32" rx="7" fill="#0B0D0E"/>
  <path d="M8 20.5c0-3.6 2.6-6.5 5.8-6.5h4.4c3.2 0 5.8 2.9 5.8 6.5" stroke="#38E08B" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  <circle cx="11" cy="22.5" r="1.8" fill="#38E08B"/>
  <circle cx="21" cy="22.5" r="1.8" fill="#38E08B"/>
</svg>
