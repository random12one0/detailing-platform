# Netlify config for the admin dashboard (app/).
#
# The base directory is set on the site itself, so paths here are relative
# to app/.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Repeated from the repo-root config on purpose. When `base` sends Netlify
  # here, this file's build settings take precedence, and a deploy launched
  # from inside app/ never reads the root file at all — so the exemption has
  # to exist in both or it silently depends on where the deploy was started.
  #
  # The Supabase URL and anon key are PUBLIC by design: the anon key is what
  # the browser presents, and every table it can reach is behind RLS. They
  # necessarily appear in the built bundle. The service-role key is
  # deliberately NOT listed — it must never reach a build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

# Single-page app: every path must serve index.html, or the router never
# sees the URL. This now covers the CUSTOMER-facing routes too — /book/<slug>
# and /booking/<id> — which are the ones arriving cold from a text message or
# a confirmation email, where a 404 is not a refresh annoyance but a lost
# booking.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# THE BOOKING PAGE MAY BE FRAMED BY OUR OWN DASHBOARD, AND BY NOTHING ELSE —
# ROADMAP 9.1c. Business shows the detailer's real `/book/<slug>` in an iframe
# (components/PagePreview.jsx), and the DENY above blanked it on the live site.
#
# This works because a `frame-ancestors` policy makes every current browser
# IGNORE X-Frame-Options on that response, so DENY still arrives and stops
# counting. Two things would break it, both silently:
#   - setting X-Frame-Options here too: both rules match /book/*, the values
#     can be merged into "DENY, SAMEORIGIN", and a browser reads a conflict as
#     DENY;
#   - adding a Content-Security-Policy to `/*`: two policies are BOTH enforced,
#     so 'none' there would beat this one.
# The two hosts are named because a detailer with their own domain gets the
# preview from that domain while the dashboard is on ours.
# `node scripts/preview-frame-headers.mjs` holds all of this.
[[headers]]
  for = "/book/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://detailingplatform.com https://www.detailingplatform.com"

# WHERE A PAGE MAY LOAD FROM — ROADMAP 97.26. REPORT-ONLY, ON PURPOSE.
#
# Every origin is listed in ROADMAP 97.26 with the file that calls it. It is
# REPORT-ONLY because two kinds of origin cannot be settled from the code: the
# photo host (media.detailingplatform.com, and R2's per-account upload host)
# lives in Cloudflare, and a logo or photo address stored in the database can
# be anything. A violation prints "[Report Only]" in the console and blocks
# nothing. Turning it into an enforced policy is its own item.
#
# A DIFFERENT HEADER NAME FROM THE `/book/*` RULE BELOW, so the two never merge
# and `frame-ancestors` there still decides who may frame the booking page.
# Do not add frame-ancestors here, and do not rename this to the enforcing
# header without reading that rule's note first.
#
# NO 'unsafe-inline' IN script-src — ROADMAP 97.90. The example sites'
# inline scripts are moved into files by scripts/build-examples.mjs, and
# /map.html's lives in /map.js. A new inline <script> anywhere in app/dist is
# refused once this enforces; the check below scans every built page for one.
# 'unsafe-inline' stays in style-src: the pages carry inline styles.
#
# STILL REPORT-ONLY, ON PURPOSE (97.90's last step). Renaming it to the
# enforcing header gives `/book/*` two rules setting the SAME header name, and
# what Netlify does then is not documented: joined with a comma, both policies
# hold; if the `/*` one replaces the `/book/*` one, frame-ancestors is lost,
# DENY applies and Business's preview goes blank. Measure it live first:
# `curl -sI https://detailingplatform.com/book/demo-detail`.
#
# `https:` IN frame-src IS THE DETAILER'S OWN DOMAIN. With a verified domain,
# Business frames the "What customers see" preview from THAT host
# (components/PagePreview.jsx, origin from context/BusinessContext.jsx), and no
# list written here can name it. It widens what a page may EMBED, not what
# script may run.
# `node scripts/csp-report-only.mjs` holds all of this.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://js.stripe.com https://*.js.stripe.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://kguqylyzgyzfktkfnhjb.supabase.co https://media.detailingplatform.com https://*.r2.cloudflarestorage.com https://images.unsplash.com https://*.stripe.com; connect-src 'self' https://kguqylyzgyzfktkfnhjb.supabase.co https://media.detailingplatform.com https://*.r2.cloudflarestorage.com https://api.stripe.com; frame-src 'self' https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"

# Hashed build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
