<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The system's ground, --ink-0. All three surfaces paint it now: the
         booking page since 2.1, the landing page since 2.2, and the dashboard
         since 2.3 — this was the last thing holding the old #0F1012. -->
    <meta name="theme-color" content="#0B0D0E" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Declared so the browser stops requesting /favicon.ico and 404ing on
         every page load. Inline SVG rather than a file: this is a
         white-label platform, so there is no logo to ship — the tenant's own
         branding renders in-app from the database. Its two colours are the
         system's own: --ink-0 for the ground, --ac for the mark. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230B0D0E'/%3E%3Cpath d='M8 20.5c0-3.6 2.6-6.5 5.8-6.5h4.4c3.2 0 5.8 2.9 5.8 6.5' stroke='%2338E08B' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='11' cy='22.5' r='1.8' fill='%2338E08B'/%3E%3Ccircle cx='21' cy='22.5' r='1.8' fill='%2338E08B'/%3E%3C/svg%3E" />
    <!-- TWO faces, one product — "The Thread", docs/design-system.md law 8:
         Archivo worked hard across both axes (wdth 62..125, wght 100..900)
         for everything that is words, and JetBrains Mono for every figure.

         FIVE FAMILIES BECAME TWO IN ROADMAP 2.3, in one edit, exactly as
         2.2's note said it would. Anybody, Public Sans and DM Mono were the
         DASHBOARD's three, held here transitionally because app/src/theme.css
         was the last thing using any of them; that file was rewritten onto
         the system in 2.3, so all three left together. 2.2 expected to drop
         some of them and correctly dropped none — theme.css used all three on
         its own, so restyling the landing page freed nothing.

         Preconnected so the first paint is not a flash of system font. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=JetBrains+Mono:wght@400;500&display=swap" />
    <!-- Generic platform title; the business's own name renders in-app from the database.
         `BookingBusinessContext` sets `document.title` to the detailer's own name
         the moment their profile loads, so a customer's tab says who they are. -->
    <title>Detailing Platform</title>

    <!-- ROADMAP 7.5 — WHAT GOOGLE AND A TEXT MESSAGE SHOW.

         Until 2026-09-06 there was no description and no Open Graph at all,
         so Google wrote its own snippet out of whatever it found and a link
         shared in a text or on Facebook appeared as a bare URL with no title
         card. Neither is a layout problem, which is why every check in this
         repo passed while it was true.

         ONE index.html SERVES ALL THREE SURFACES — the marketing page, a
         tenant booking page and the dashboard — so what is written here
         describes the marketing page, which is the only one anybody shares
         to be read. **A shared BOOKING link therefore shows this card rather
         than the detailer's**, and that cannot be fixed from here: a crawler
         does not run the JavaScript that knows whose page it is. Prerendering
         those routes is its own item and is written into the roadmap.

         THE COPY IS PRODUCT.md § Positioning IN ITS ORDER: the website
         leads, the dashboard is not an accessory, and the two are one
         purchase. No SaaS-speak — `tests/landing-pricing.test.mjs` has
         refused "streamline" and its family on the page itself since 2.2 and
         now refuses them here.

         AND THERE IS NO og:image, WHICH IS DELIBERATE RATHER THAN FORGOTTEN.
         This is a white-label platform with no logo by design, and a card
         image invented tonight is a brand decision made by a session. Without
         one, `summary` is the correct card type: `summary_large_image`
         promises a picture and renders an empty box when there is none. -->
    <meta name="description" content="A custom website for one detailing business, and the dashboard that runs it. Your prices, your hours and your customers live in the same place, and changing one on your phone changes the site." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Detailing Platform" />
    <meta property="og:url" content="https://detailingplatform.com/" />
    <meta property="og:title" content="A website for your detailing business, and the dashboard that runs it" />
    <meta property="og:description" content="One build, one price. The website is yours and custom; the dashboard takes the bookings, keeps the calendar and changes the site from your phone." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="A website for your detailing business, and the dashboard that runs it" />
    <meta name="twitter:description" content="One build, one price. The website is yours and custom; the dashboard takes the bookings, keeps the calendar and changes the site from your phone." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
