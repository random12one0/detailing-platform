# Fallback build config, used only if Netlify reads the config from inside the
# base directory instead of the repo root. Deliberately does NOT set `base` —
# the root netlify.toml owns that, and re-declaring it here could resolve to
# frontend/frontend. Keep the rest in sync with the root file.
[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  CI = "false"
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_SUPABASE_ANON_KEY,REACT_APP_SUPABASE_URL,REACT_APP_SUPABASE_FUNCTIONS_URL"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
